# Deploy target that serves the built frontend and the API from one Worker.
#   npx wrangler dev    -c worker/wrangler.toml
#   npx wrangler deploy -c worker/wrangler.toml
#
# The root wrangler.toml stays as it is: it belongs to the Cloudflare Pages project.

name = "pixtooth-edge"
main = "index.js"
compatibility_date = "2025-10-01"
# The app has exactly one public address, the app.pixtooth.com custom domain: a second
# hostname would answer the same requests without the cookie and CORS setup that domain
# implies, so the workers.dev route stays off on purpose rather than by default.
workers_dev = false
# nodejs_compat covers Buffer, node:crypto and friends; the populate flag copies Worker
# vars and secrets into process.env, which is where the server reads its configuration.
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]

[assets]
# Vite output: /assets/* is content hashed, /static/* is hand managed.
directory = "../dist"
binding = "ASSETS"
not_found_handling = "none"
# The Worker answers every request, so the cache policy in server/src/http/staticPolicy.js
# applies to assets as well. Without this, Cloudflare would serve matching assets before
# the Worker and the two hosts would answer with different headers.
run_worker_first = true

# Bundling the AWS SDK needs a build condition list without "browser".
#
# Wrangler resolves dependencies with `workerd,worker,browser`. Several SDK subpaths
# (@aws-sdk/core/client, @aws-sdk/core/httpAuthSchemes, @smithy/core/config,
# @smithy/core/checksum, @smithy/core/retry, @smithy/core/serde) ship a browser build that
# replaces Node-only helpers with `Symbol.for("node-only")`, while the surrounding SDK code
# calls those helpers unconditionally. The browser build then wins the resolution, and the
# client throws `emitWarningIfUnsupportedVersion is not a function` or
# `loadConfig is not a function` the first time it is constructed.
#
# Dropping "browser" makes those subpaths resolve through `import`/`require`, which are the
# Node builds this runtime supports. Wrangler reads the list only from the environment, so
# scripts/deploy-worker.mjs and the npm scripts set it. A `wrangler` command run by hand
# needs `WRANGLER_BUILD_CONDITIONS=workerd,worker,node` in front of it.
#
# WRANGLER_BUILD_CONDITIONS = "workerd,worker,node"

# The resources and the users are in Europe: the DynamoDB table this Worker reads lives in
# eu-central-1 (Frankfurt). targeted pins execution to that region instead of letting
# Cloudflare pick a location from request traffic, which could send EU data elsewhere.
[placement]
mode = "targeted"
region = "aws:eu-central-1"

[observability]
enabled = true

[vars]
NODE_ENV = "production"
# Secrets are not stored here:
#   npx wrangler secret put JWT_SECRET -c worker/wrangler.toml
# and the same for REFRESH_TOKEN_SECRET, DYNAMODB_TABLE_NAME, AWS_REGION, AWS_ACCOUNT_ID,
# AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, GOOGLE_CLIENT_ID, EMAIL_PROVIDER, EMAIL_FROM,
# RESEND_API_KEY, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_EMAIL_API_TOKEN, PASSWORD_RESET_URL,
# TELEMETRY_EXPORT_SECRET.
