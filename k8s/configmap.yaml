apiVersion: v1
kind: ConfigMap
metadata:
  name: dental-chart-config
  namespace: dental-chart
data:
  PORT: "3001"
  HOST: "0.0.0.0"
  NODE_ENV: "production"
  CORS_ORIGIN: "https://app.pixtooth.com"
  ENABLE_TELEMETRY: "false"
  AI_ANALYSIS_ENABLED: "false"
  AWS_REGION: "eu-central-1"
  DYNAMODB_TABLE_NAME: "DentalChart"
  # Accounts allowed into the separate admin app. Keep the list in a Secret when it
  # contains personal addresses, or set it here if the addresses are operational.
  PLATFORM_ADMIN_EMAILS: ""
  # Database driver: dynamo (default) or postgres. For Postgres, put DATABASE_URL in a
  # Secret and set DB_DRIVER here; see docs/postgres-setup.md.
  DB_DRIVER: "dynamo"
  # DB_DRIVER: "postgres"
  # DATABASE_SSL: "false"
  # DATABASE_SCHEMA: "public"
  # DATABASE_POOL_MAX: "10"
  # Sessions stay valid for a year of inactivity and slide on every refresh, so anyone
  # who opens the app at least once a year is never asked to log in again.
  REFRESH_TOKEN_EXPIRES_IN: "365d"
  # Replaying a just-rotated refresh token within this window (two open tabs) keeps
  # the session alive; beyond it the whole session family is revoked as a leak.
  REFRESH_TOKEN_REUSE_GRACE_MS: "10000"
  # Set to the OAuth 2.0 Web client id to enable "Continue with Google".
  # GOOGLE_CLIENT_ID: "xxxxxxxx.apps.googleusercontent.com"
  # Email transport: resend | cloudflare | gmail (see apps/backend/.env.example)
  # EMAIL_PROVIDER: "cloudflare"
  # EMAIL_FROM: "Pixtooth <no-reply@pixtooth.com>"
  # CLOUDFLARE_ACCOUNT_ID: ""
  # CLOUDFLARE_EMAIL_API_TOKEN: ""
  # Stripe billing: one license, $30/month or $300/year. Put the two price_... IDs here
  # and the API keys in the Secret. Leave empty to hide checkout.
  # PUBLIC_WEB_ORIGIN: "https://app.pixtooth.com"
  # STRIPE_PRICE_MONTHLY: "price_..."
  # STRIPE_PRICE_YEARLY: "price_..."
