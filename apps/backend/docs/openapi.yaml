openapi: 3.1.0
info:
  title: Dental Chart API
  version: 1.0.0
  description: >
    Contract API for clinic collaboration, patient access, plan enforcement,
    and limited external patient synchronization.

servers:
  - url: /

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: Medic-level API key. You can also send it as a Bearer token.

  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    AdminAccount:
      type: object
      required:
        - id
        - name
        - email
        - status
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        status:
          type: string
          enum: [active, disabled]
        subscriptionPlan:
          type: string
        createdAt:
          type: [string, 'null']
          format: date-time
        authProviders:
          type: array
          items:
            type: string
        googleLinked:
          type: boolean

    AdminAccountStatus:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum: [active, disabled]

    ClinicInvitation:
      type: object
      required:
        - invitedEmail
      properties:
        invitedEmail:
          type: string
          format: email
        invitedByMedicId:
          type: string
        role:
          type: string
          enum: [owner, admin, member]

    OwnershipTransfer:
      type: object
      required:
        - newOwnerMedicId
      properties:
        newOwnerMedicId:
          type: string

    DeleteMedicRequest:
      type: object
      properties:
        transferOwnershipTo:
          oneOf:
            - type: string
            - type: object
              additionalProperties:
                type: string
          description: Medic ID or a clinicId-to-medicId map for ownership transfers.

    ExternalPatientPayload:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        id:
          type: string
          description: Optional on create, required on update.
        name:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [Male, Female, Other]
        phone:
          type: string
        email:
          type: string
          format: email

    Patient:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
        phone:
          type: string
        email:
          type: string
        clinicId:
          type: string
        medicId:
          type: string
        ownerMedicId:
          type: string

    BillingStatus:
      type: object
      required:
        - enabled
        - provider
        - plan
        - status
        - licensed
        - prices
        - currency
        - portalAvailable
      properties:
        enabled:
          type: boolean
          description: False when the deployment has no complete Stripe configuration.
        provider:
          type: string
          enum: [stripe]
        plan:
          type: string
          enum: [free, pro]
        status:
          type: string
          enum: [inactive, active, trialing, past_due, unpaid, canceled, paused, incomplete]
        licensed:
          type: boolean
          description: True for an active or trialing subscription.
        interval:
          type: [string, 'null']
          enum: [month, year, null]
        currentPeriodEnd:
          type: [string, 'null']
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        prices:
          type: object
          required:
            - month
            - year
          properties:
            month:
              type: number
              example: 30
            year:
              type: number
              example: 300
        currency:
          type: string
          example: usd
        portalAvailable:
          type: boolean


paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Server status

  /api/config:
    get:
      summary: Read the safe deployment configuration
      description: >
        Reports the database driver, email provider, Google and AI state, and which
        variables are missing. Secret values are never returned.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Configuration state for the settings screen
          content:
            application/json:
              schema:
                type: object
                properties:
                  database:
                    type: object
                    properties:
                      driver:
                        type: string
                        enum: [dynamo, postgres]
                      tableName:
                        type: string
                      target:
                        type: object
                  email:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      provider:
                        type: string
                      requestedProvider:
                        type: [string, 'null']
                      detail:
                        type: [string, 'null']
                  google:
                    type: object
                    properties:
                      configured:
                        type: boolean
                  billing:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      provider:
                        type: string
                      prices:
                        type: object
                        properties:
                          month:
                            type: number
                          year:
                            type: number
                      currency:
                        type: string
                  ai:
                    type: object
                  auth:
                    type: object
                  warnings:
                    type: array
                    items:
                      type: string
        '401':
          description: Missing or invalid session

  /api/config/test-email:
    post:
      summary: Send a test email to the authenticated account
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: >-
            Delivery result. A false `delivered` value names the provider reason.
          content:
            application/json:
              schema:
                type: object
                properties:
                  to:
                    type: string
                    format: email
                  delivered:
                    type: boolean
                  provider:
                    type: string
                  reason:
                    type: [string, 'null']
                  detail:
                    type: [string, 'null']
        '401':
          description: Missing or invalid session

  /api/billing/status:
    get:
      summary: Read the license state of the authenticated account
      description: >
        The license covers unlimited patients in the account's personal workspace and
        removes the 5-patient cap for members of the workspaces it owns. Members keep
        the cap in their own personal workspaces.
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Current plan, Stripe status and the available prices
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingStatus'
        '401':
          description: Missing or invalid session

  /api/billing/checkout:
    post:
      summary: Start a Stripe Checkout session for the license
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - interval
              properties:
                interval:
                  type: string
                  enum: [month, year]
      responses:
        '200':
          description: Hosted Stripe Checkout URL
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          description: Unknown interval
        '401':
          description: Missing or invalid session
        '409':
          description: The account already has an active or pending subscription
        '503':
          description: Stripe is not configured on this deployment

  /api/billing/portal:
    post:
      summary: Open the Stripe billing portal
      security:
        - ApiKeyAuth: []
      responses:
        '200':
          description: Hosted Stripe billing portal URL
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
        '400':
          description: The account has no Stripe customer yet
        '401':
          description: Missing or invalid session
        '503':
          description: Stripe is not configured on this deployment

  /api/billing/webhook:
    post:
      summary: Receive Stripe subscription events
      description: >
        Called by Stripe only. The signature in the `stripe-signature` header is
        verified against the raw request body; the subscription status here is the
        source of truth for the license.
      responses:
        '200':
          description: Event accepted
        '400':
          description: Missing or invalid signature
        '503':
          description: Stripe is not configured on this deployment

  /api/clinics:
    post:
      summary: Create a clinic or organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - ownerMedicId
              properties:
                name:
                  type: string
                ownerMedicId:
                  type: string
                type:
                  type: string
                  enum: [personal, organization]
      responses:
        '201':
          description: Clinic created
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/clinics/{id}:
    get:
      summary: Get clinic details including members and invitations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clinic found
        '404':
          description: Clinic not found

  /api/clinics/{id}/members:
    get:
      summary: List clinic members
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Members list

  /api/clinics/{id}/invitations:
    post:
      summary: Invite a medic into a clinic
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClinicInvitation'
      responses:
        '201':
          description: Invitation created

  /api/clinics/{id}/invitations/{inviteId}/accept:
    post:
      summary: Accept a clinic invitation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: inviteId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - medicId
              properties:
                medicId:
                  type: string
      responses:
        '200':
          description: Invitation accepted

  /api/clinics/{id}/ownership-transfer:
    post:
      summary: Transfer clinic ownership to another active member
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnershipTransfer'
      responses:
        '200':
          description: Ownership transferred

  /api/medics/{id}/clinics:
    get:
      summary: List clinics available to a medic account
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Clinics list

  /api/medics/{id}:
    delete:
      summary: Delete a medic account and all patients owned by that medic
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteMedicRequest'
      responses:
        '200':
          description: Medic deleted
        '409':
          description: Ownership transfer required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/medics/{id}/api-key/rotate:
    post:
      summary: Rotate medic API key
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: API key rotated

  /api/external/patients:
    post:
      summary: Create or upsert a patient through the external contract API
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalPatientPayload'
      responses:
        '201':
          description: Patient created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '403':
          description: Plan limit or access issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/external/patients/{id}:
    put:
      summary: Update only the allowed patient contract fields
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalPatientPayload'
      responses:
        '200':
          description: Patient updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'

    delete:
      summary: Delete a patient through the external contract API
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Patient deleted

  /api/admin/accounts:
    get:
      summary: List accounts for the admin app
      description: >-
        Requires an authenticated account whose e-mail is listed in
        PLATFORM_ADMIN_EMAILS. Credential columns never appear in the response.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Case-insensitive match on name or e-mail.
        - in: query
          name: status
          schema:
            type: string
            enum: [active, disabled]
      responses:
        '200':
          description: Account summaries, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminAccount'
        '401':
          description: Missing or invalid session
        '403':
          description: The account is not a platform administrator

  /api/admin/accounts/{id}:
    get:
      summary: Read one account
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '401':
          description: Missing or invalid session
        '403':
          description: The account is not a platform administrator
        '404':
          description: Account not found

    patch:
      summary: Enable or disable an account
      description: Disabling revokes every refresh token for that account.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAccountStatus'
      responses:
        '200':
          description: Updated account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAccount'
        '400':
          description: Invalid status, or an attempt to disable the signed-in administrator
        '401':
          description: Missing or invalid session
        '403':
          description: The account is not a platform administrator
        '404':
          description: Account not found

    delete:
      summary: Delete an account and its patient data
      description: >-
        Removes the account, its patients and its clinic memberships. An owned clinic
        with other active members needs an ownership transfer first.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Account deleted
        '400':
          description: An attempt to delete the signed-in administrator
        '401':
          description: Missing or invalid session
        '403':
          description: The account is not a platform administrator
        '404':
          description: Account not found
        '409':
          description: Ownership transfer required before deleting an owned clinic

  /api/auth/forgot-password:
    post:
      summary: Send password reset instructions by email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Request accepted

  /api/auth/reset-password:
    post:
      summary: Reset a password with token or 6-digit code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - newPassword
              properties:
                email:
                  type: string
                  format: email
                token:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password updated

  /api/auth/change-password:
    post:
      summary: Change password for an authenticated user
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
      responses:
        '200':
          description: Password changed
