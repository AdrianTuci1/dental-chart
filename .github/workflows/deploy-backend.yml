name: Deploy Backend

on:
  workflow_dispatch:

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Backend
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test -- --runInBand


  deploy:
    runs-on: ubuntu-latest
    name: Deploy Backend to VPS
    needs: validate
    env:
      DEPLOY_ROOT: /root/pixtooth-backend
      BACKEND_PORT: '3100'
      BACKEND_HOST: 127.0.0.1
      API_DOMAIN: api.pixtooth.com
      RELEASE_ID: ${{ github.run_id }}-${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat >> ~/.ssh/config <<EOF
          Host vps
            HostName ${{ secrets.VPS_IP }}
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/deploy_key
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Clean up stale incoming directories
        run: |
          ssh vps "rm -rf '$DEPLOY_ROOT/incoming' && mkdir -p '$DEPLOY_ROOT/incoming/$RELEASE_ID'"

      - name: Upload backend release
        run: |
          rsync -avz --delete \
            --exclude 'node_modules' \
            --exclude '.env' \
            --exclude 'logs' \
            --exclude '.git' \
            apps/backend/ "vps:$DEPLOY_ROOT/incoming/$RELEASE_ID/"

      - name: Upload VPS release assets
        run: |
          rsync -avz deploy/vps/bootstrap-vps.sh deploy/vps/deploy-release.sh \
            "vps:$DEPLOY_ROOT/incoming/$RELEASE_ID/scripts/"
          rsync -avz deploy/vps/nginx/ \
            "vps:$DEPLOY_ROOT/incoming/$RELEASE_ID/scripts/nginx/"
          rsync -avz deploy/vps/ecosystem.config.js \
            "vps:$DEPLOY_ROOT/incoming/$RELEASE_ID/"

      - name: Write environment variables on VPS
        run: |
          JWT_SECRET=$(openssl rand -hex 32)
          REFRESH_TOKEN_SECRET=$(openssl rand -hex 32)
          ssh vps "cat > '$DEPLOY_ROOT/shared/.env' << ENVEOF
          NODE_ENV=production
          HOST=127.0.0.1
          PORT=$BACKEND_PORT
          CORS_ORIGIN=https://app.pixtooth.com

          JWT_SECRET=${JWT_SECRET}
          REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}

          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION=${{ vars.AWS_REGION || 'eu-central-1' }}
          DYNAMODB_TABLE_NAME=${{ vars.DYNAMODB_TABLE_NAME || 'DentalChart' }}

          DB_DRIVER=${{ vars.DB_DRIVER || 'dynamo' }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          DATABASE_SSL=${{ vars.DATABASE_SSL || 'false' }}
          DATABASE_SCHEMA=${{ vars.DATABASE_SCHEMA || 'public' }}
          DATABASE_POOL_MAX=${{ vars.DATABASE_POOL_MAX || '10' }}
          DATABASE_POOL_IDLE_TIMEOUT_MS=${{ vars.DATABASE_POOL_IDLE_TIMEOUT_MS || '10000' }}
          DATABASE_POOL_CONNECTION_TIMEOUT_MS=${{ vars.DATABASE_POOL_CONNECTION_TIMEOUT_MS || '10000' }}

          ENABLE_TELEMETRY=false
          AI_ANALYSIS_ENABLED=false
          ENVEOF"

      - name: Bootstrap VPS and activate release
        run: |
          ssh vps << 'REMOTE'
            set -euo pipefail
            export DEPLOY_ROOT='${{ env.DEPLOY_ROOT }}'
            export BACKEND_PORT='${{ env.BACKEND_PORT }}'
            export BACKEND_HOST='${{ env.BACKEND_HOST }}'
            export API_DOMAIN='${{ env.API_DOMAIN }}'
            export RELEASE_ID='${{ env.RELEASE_ID }}'
            cd "$DEPLOY_ROOT/incoming/$RELEASE_ID"
            bash scripts/bootstrap-vps.sh
            bash scripts/deploy-release.sh
          REMOTE
