name: 🚀 Deploy to AWS Lambda

# One artifact carries apps/frontend/dist next to apps/backend/, wrapped by deploy/lambda/template.yaml
# in a function behind an API Gateway HTTP API. See docs/serverless-deployment.md.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without deploying
        type: boolean
        default: false

concurrency:
  group: deploy-lambda-production
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  STACK_NAME: ${{ vars.STACK_NAME || 'pixtooth' }}
  API_DOMAIN: ${{ vars.API_DOMAIN || 'api.pixtooth.com' }}
  ARTIFACTS_BUCKET: ${{ vars.ARTIFACTS_BUCKET }}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            apps/frontend/package-lock.json
            apps/backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/frontend

      - name: Run frontend tests
        run: npm test --prefix apps/frontend

      - name: Install backend dependencies
        run: npm ci --prefix apps/backend

      - name: Run backend tests
        run: npm test --prefix apps/backend -- --runInBand

      - name: Check dependency licenses
        run: npm run check:licenses


  deploy:
    runs-on: ubuntu-latest
    name: Deploy Lambda
    needs: validate
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Setup SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm ci --prefix apps/frontend

      - name: Write deployment variables
        run: |
          cat > .env.deploy << ENVEOF
          AWS_REGION=${{ env.AWS_REGION }}
          STACK_NAME=${{ env.STACK_NAME }}
          API_DOMAIN=${{ env.API_DOMAIN }}
          API_CERTIFICATE_ARN=${{ vars.API_CERTIFICATE_ARN }}
          ARTIFACTS_BUCKET=${{ env.ARTIFACTS_BUCKET }}

          DYNAMODB_TABLE_NAME=${{ vars.DYNAMODB_TABLE_NAME || 'DentalChart' }}
          CORS_ORIGIN=${{ vars.CORS_ORIGIN }}
          PLATFORM_ADMIN_EMAILS=${{ vars.PLATFORM_ADMIN_EMAILS }}
          PASSWORD_RESET_URL=${{ vars.PASSWORD_RESET_URL }}

          JWT_SECRET=${{ secrets.JWT_SECRET }}
          REFRESH_TOKEN_SECRET=${{ secrets.REFRESH_TOKEN_SECRET }}

          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER || 'resend' }}
          EMAIL_FROM=${{ vars.EMAIL_FROM }}
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_API_TOKEN=${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          MODAL_INFERENCE_URL=${{ vars.MODAL_INFERENCE_URL }}
          AI_ANALYSIS_ENABLED=${{ vars.AI_ANALYSIS_ENABLED || 'false' }}
          ENABLE_TELEMETRY=${{ vars.ENABLE_TELEMETRY || 'false' }}
          TELEMETRY_EXPORT_SECRET=${{ secrets.TELEMETRY_EXPORT_SECRET }}

          PUBLIC_WEB_ORIGIN=${{ vars.PUBLIC_WEB_ORIGIN || 'https://app.pixtooth.com' }}
          STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_MONTHLY=${{ vars.STRIPE_PRICE_MONTHLY }}
          STRIPE_PRICE_YEARLY=${{ vars.STRIPE_PRICE_YEARLY }}
          ENVEOF

      # A stack that cannot resolve its own hostname, or that rotates its signing keys on
      # every run, is worse than no deploy at all. A dry run uploads nothing, so it does
      # not need the S3 bucket the real deploy goes through.
      - name: Check the required variables are set
        run: |
          failed=0
          names="API_CERTIFICATE_ARN CORS_ORIGIN JWT_SECRET REFRESH_TOKEN_SECRET"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            names="$names ARTIFACTS_BUCKET"
          fi
          for name in $names; do
            if ! grep -q "^$name=.\+" .env.deploy; then
              echo "::error::$name is empty. Set it as a repository variable or secret."
              failed=1
            fi
          done
          exit $failed

      - name: Deploy
        run: npm run deploy:lambda -- --yes ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Stack ${{ env.STACK_NAME }} deployed for https://${{ env.API_DOMAIN }}"
          else
            echo "Stack deploy failed"
          fi
