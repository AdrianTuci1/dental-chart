name: ☁️ Deploy to Cloudflare Workers

# One Worker serves the built frontend through its assets binding and the API through
# the shared route table. See docs/serverless-deployment.md.
#
# Repository secrets you must add (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   deploy credential for the account that owns the Worker
#   CLOUDFLARE_ACCOUNT_ID  that account's id
# Everything the Worker stores as a secret is read from Secret Manager instead: the
# workflow trades the GitHub OIDC token for a short-lived Google credential, so no service
# account key exists. Optional repository secrets for integrations that are not in Secret
# Manager: CLOUDFLARE_EMAIL_API_TOKEN, TELEMETRY_EXPORT_SECRET.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and bundle without uploading
        type: boolean
        default: false

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  API_DOMAIN: ${{ vars.API_DOMAIN || 'api.pixtooth.com' }}
  APP_ORIGIN: https://${{ vars.APP_DOMAIN || 'app.pixtooth.com' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npx vitest run

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Run backend tests
        run: npm test --prefix server -- --runInBand

  deploy:
    runs-on: ubuntu-latest
    name: Deploy Worker
    needs: validate
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      # The GitHub OIDC token is exchanged for a short-lived Google credential. Only
      # pixtooth@pixtooth.iam.gserviceaccount.com may read the secrets below, and the
      # provider's condition pins the exchange to this repository.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/233956133307/locations/global/workloadIdentityPools/github/providers/github
          service_account: pixtooth@pixtooth.iam.gserviceaccount.com

      - name: Read deployment secrets from Secret Manager
        id: gcloud-secrets
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            AWS_REGION:projects/233956133307/secrets/AWS_REGION
            AWS_ACCOUNT_ID:projects/233956133307/secrets/AWS_ACCOUNT_ID
            DYNAMODB_TABLE_NAME:projects/233956133307/secrets/DYNAMODB_TABLE_NAME
            AWS_ACCESS_KEY_ID:projects/233956133307/secrets/AWS_ACCESS_KEY_ID
            AWS_SECRET_ACCESS_KEY:projects/233956133307/secrets/AWS_SECRET_ACCESS_KEY
            JWT_SECRET:projects/233956133307/secrets/JWT_SECRET
            REFRESH_TOKEN_SECRET:projects/233956133307/secrets/REFRESH_TOKEN_SECRET
            RESEND_API_KEY:projects/233956133307/secrets/RESEND_API_KEY
            GOOGLE_CLIENT_ID:projects/233956133307/secrets/GOOGLE_CLIENT_ID

      # The deploy script reads this file and pushes every value it recognises as a Worker
      # secret, and it passes GOOGLE_CLIENT_ID to the frontend build so Vite bakes it in.
      # Writing it here keeps the Worker secret and the bundle from the same source.
      - name: Write deployment variables
        run: |
          cat > .env.deploy << ENVEOF
          AWS_REGION=${{ steps.gcloud-secrets.outputs.AWS_REGION }}
          AWS_ACCOUNT_ID=${{ steps.gcloud-secrets.outputs.AWS_ACCOUNT_ID }}
          DYNAMODB_TABLE_NAME=${{ steps.gcloud-secrets.outputs.DYNAMODB_TABLE_NAME }}
          CORS_ORIGIN=${{ env.APP_ORIGIN }}
          PASSWORD_RESET_URL=${{ env.APP_ORIGIN }}/reset-password

          # The identity the Worker runs as: an IAM user scoped to the DynamoDB table.
          # Deliberately not the key pair that deploys the Lambda stack.
          AWS_ACCESS_KEY_ID=${{ steps.gcloud-secrets.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ steps.gcloud-secrets.outputs.AWS_SECRET_ACCESS_KEY }}

          JWT_SECRET=${{ steps.gcloud-secrets.outputs.JWT_SECRET }}
          REFRESH_TOKEN_SECRET=${{ steps.gcloud-secrets.outputs.REFRESH_TOKEN_SECRET }}

          GOOGLE_CLIENT_ID=${{ steps.gcloud-secrets.outputs.GOOGLE_CLIENT_ID }}
          EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER || 'resend' }}
          EMAIL_FROM=${{ vars.EMAIL_FROM }}
          RESEND_API_KEY=${{ steps.gcloud-secrets.outputs.RESEND_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL_API_TOKEN=${{ secrets.CLOUDFLARE_EMAIL_API_TOKEN }}
          MODAL_INFERENCE_URL=${{ vars.MODAL_INFERENCE_URL }}
          AI_ANALYSIS_ENABLED=${{ vars.AI_ANALYSIS_ENABLED || 'false' }}
          ENABLE_TELEMETRY=${{ vars.ENABLE_TELEMETRY || 'false' }}
          TELEMETRY_EXPORT_SECRET=${{ secrets.TELEMETRY_EXPORT_SECRET }}
          ENVEOF

      - name: Check the required secrets are set
        run: |
          for name in JWT_SECRET REFRESH_TOKEN_SECRET AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if ! grep -q "^$name=.\+" .env.deploy; then
              echo "::error::$name is missing; the Worker would deploy and then fail on the routes that need it."
              exit 1
            fi
          done

      - name: Deploy
        run: npm run deploy:worker -- ${{ inputs.dry_run && '--dry-run' || '' }} --sync-secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "Worker deployed for https://${{ env.API_DOMAIN }}"
          else
            echo "Worker deploy failed"
          fi
